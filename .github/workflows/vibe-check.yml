name: Vibe Check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: vibe-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  DO_NOT_TRACK: 1
  TURBO_TELEMETRY_DISABLED: 1
  VERCEL_TELEMETRY_DISABLED: 1

jobs:
  mise-lock-check:
    name: Mise Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache mise binary 🗃️
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/mise
          key: mise-${{ runner.os }}-${{ hashFiles('scripts/install-mise') }}

      - name: Install mise 🔧
        run: |
          # Put the cached binary on PATH first so install-mise's version check finds it
          # and skips re-downloading the pinned release on a cache hit.
          export PATH="${HOME}/.local/bin:${PATH}"
          ./scripts/install-mise
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify mise.lock is in sync 🔒
        run: |
          mise trust ./mise.toml
          mise lock
          if ! git diff --exit-code mise.lock; then
            echo "::error::mise.lock is out of sync with .nvmrc / package.json#packageManager."
            echo "::error::Run 'mise run relock' locally and commit the result."
            exit 1
          fi

  vibe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v6
        # use version from package.json#packageManager field
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Dependencies 📥
        run: |
          pnpm install

      - name: Type Check 🔎
        run: pnpm run typecheck

      - name: Lint 🔍
        run: pnpm run lint

      - name: Format Check 🎨
        run: pnpm run fmt:check

      - name: Test 🧪
        run: | # Run the tests
          pnpm run test

      - name: Ensure Package is Publishable 🧐
        run:
          | # Run the prepublish hook to ensure the package is publishable, and that the package.json is up to date
          pnpm run prepublishOnly
          git diff --exit-code
