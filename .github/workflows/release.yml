name: release
on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC (npm provenance)
  contents: write
  pull-requests: write

env:
  DO_NOT_TRACK: 1

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'ngrok/gen-x'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use pnpm version from root package.json#packageManager
      - name: Install pnpm 📦
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # setup-node also writes the npm registry and NODE_AUTH_TOKEN wiring
      # (.npmrc) that changeset publish relies on.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies 📥
        run: pnpm install --frozen-lockfile

      - name: Compile 🔨
        run: pnpm run compile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Why the input, not a GITHUB_TOKEN env var: action v2 reads only the
          # input, and the env var would silently fall back to the default token.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm exec changeset publish
          version-script: pnpm exec changeset version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
